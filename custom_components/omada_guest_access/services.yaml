approve_request:
  name: Approve guest request
  description: Approve a pending guest Wi-Fi access request.
  fields:
    request_id:
      required: true
      selector:
        text:
    duration_hours:
      required: false
      selector:
        number:
          min: 1
          max: 720
          mode: box
deny_request:
  name: Deny guest request
  description: Deny a pending guest Wi-Fi access request.
  fields:
    request_id:
      required: true
      selector:
        text:
    reason:
      required: false
      selector:
        text:
revoke_access:
  name: Revoke guest access
  description: Cancel guest internet authorization through the Hotspot Manager web API. Requires operator client-management permission. Marks the request revoked only after controller confirmation.
  fields:
    request_id:
      required: true
      selector:
        text:

