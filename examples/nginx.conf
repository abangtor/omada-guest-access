# Include in nginx's http context. Replace hostnames, TLS paths and network IPs.
server {
    listen 443 ssl;
    server_name guest.example.com;
    ssl_certificate /etc/letsencrypt/live/guest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guest.example.com/privkey.pem;

    # The landing query contains guest identifiers. Avoid retaining them.
    access_log off;
    client_max_body_size 8k;

    location / {
        proxy_pass http://192.168.10.10:8088;
        proxy_set_header Host $host;
        # Overwrite, do not relay an untrusted browser-supplied header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
# In integration options:
# portal_url: https://guest.example.com
# trusted_proxies: <nginx host IP>/32
# allowed_networks: 192.168.50.0/24
# Firewall: allow nginx -> HA:8088; deny guests -> HA:8123/controller/LAN.
